@if (open()) {
  <app-modal
    size="md"
    [title]="(isEdit() ? 'transfer.edit' : 'transfer.new') | t"
    [submitting]="submitting()"
    [submitLabel]="(isEdit() ? 'common.saveChanges' : 'transfer.submit') | t"
    [busyLabel]="'common.saving' | t"
    [error]="error()"
    (closed)="closed.emit()"
    (submitted)="submit()"
  >
    <div class="swap-row">
      <div class="field">
        <label for="tf-from">{{ 'common.from' | t }}</label>
        <div class="input">
          <select
            id="tf-from"
            name="from"
            [ngModel]="fromId()"
            (ngModelChange)="fromId.set($event)"
          >
            @for (a of accounts(); track a.id) {
              <option [value]="a.id">{{ a.name }}</option>
            }
          </select>
        </div>
      </div>
      <span class="swap-icon" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="m17 2 4 4-4 4" />
          <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
          <path d="m7 22-4-4 4-4" />
          <path d="M21 13v1a4 4 0 0 1-4 4H3" />
        </svg>
      </span>
      <div class="field">
        <label for="tf-to">{{ 'common.to' | t }}</label>
        <div class="input">
          <select id="tf-to" name="to" [ngModel]="toId()" (ngModelChange)="toId.set($event)">
            @for (a of accounts(); track a.id) {
              <option [value]="a.id">{{ a.name }}</option>
            }
          </select>
        </div>
      </div>
    </div>

    <div class="form-grid">
      <div class="field">
        <label for="tf-amount">{{ 'common.amount' | t }}</label>
        <div class="input">
          <select
            class="ccy-select"
            name="currency"
            [attr.aria-label]="'common.currency' | t"
            [ngModel]="currency()"
            (ngModelChange)="currency.set($event)"
          >
            @let ccy = currencyOptions();
            @if (ccy.favorites.length > 0) {
              <optgroup [label]="'currency.favorites' | t">
                @for (c of ccy.favorites; track c) {
                  <option [value]="c">{{ c }}</option>
                }
              </optgroup>
            }
            <optgroup [label]="'currency.all' | t">
              @for (c of ccy.others; track c) {
                <option [value]="c">{{ c }}</option>
              }
            </optgroup>
          </select>
          <input
            id="tf-amount"
            name="amount"
            class="num-in"
            type="number"
            inputmode="decimal"
            step="0.01"
            min="0"
            placeholder="0.00"
            autocomplete="off"
            [ngModel]="amount()"
            (ngModelChange)="amount.set($event)"
          />
        </div>
      </div>

      <div class="field">
        <label for="tf-date">{{ 'common.date' | t }}</label>
        <div class="input"><input id="tf-date" name="date" type="date" [(ngModel)]="date" /></div>
      </div>

      <div class="field span-2">
        <label for="tf-title-input">{{ 'common.title' | t }}</label>
        <div class="input">
          <input
            id="tf-title-input"
            name="title"
            type="text"
            maxlength="200"
            [placeholder]="'common.optional' | t"
            [(ngModel)]="title"
          />
        </div>
      </div>
    </div>

    @if (loading()) {
      <p class="loading muted small" role="status">{{ 'transfer.loading' | t }}</p>
    }

    @let s = summary();
    <div class="summary-box summary" role="status">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" />
        <path d="M12 16v-4M12 8h.01" />
      </svg>
      <span
        >{{ 'transfer.move' | t }} <strong>{{ s.amount }}</strong> {{ 'transfer.from' | t }}
        <strong>{{ s.from }}</strong> {{ 'transfer.to' | t }} <strong>{{ s.to }}</strong>.
        {{ 'transfer.sameCurrency' | t }}</span
      >
    </div>
  </app-modal>
}
