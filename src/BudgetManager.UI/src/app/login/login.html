<main class="card">
  <div class="head">
    <h1>Sign in</h1>
    <p class="sub">Enter your email and password.</p>
  </div>

  <form (ngSubmit)="submit()">
    <div class="field">
      <label for="email">Email</label>
      <div class="input">
        <input
          id="email"
          type="email"
          name="email"
          autocomplete="email"
          placeholder="you@example.com"
          [(ngModel)]="email"
        />
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          placeholder="Your password"
          [(ngModel)]="password"
        />
        <button
          type="button"
          class="reveal"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          (click)="togglePassword()"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
        Keep me signed in
      </label>
      <a class="link" href="#reset">Forgot password?</a>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ submitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <p class="foot">No account? <a class="link" routerLink="/register">Create one</a></p>
</main>
