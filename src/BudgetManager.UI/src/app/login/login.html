<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="'common.toggleTheme' | t"
  (click)="toggleTheme()"
>
  <svg
    class="sun"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <circle cx="12" cy="12" r="4" />
    <path
      d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
    />
  </svg>
  <svg
    class="moon"
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
  </svg>
</button>

<main class="card">
  <div class="head">
    <h1>{{ 'login.title' | t }}</h1>
    <p class="sub">{{ 'login.sub' | t }}</p>
  </div>

  <form (ngSubmit)="submit()">
    <div class="field">
      <label for="email">{{ 'auth.email' | t }}</label>
      <div class="input">
        <!-- Plain text, not type="email": the API accepts any login name. The dev seed's user is test@example.com / testtest. -->
        <input
          id="email"
          type="text"
          name="email"
          autocomplete="username"
          autocapitalize="off"
          spellcheck="false"
          placeholder="you@example.com"
          [(ngModel)]="email"
        />
      </div>
    </div>

    <div class="field">
      <label for="password">{{ 'auth.password' | t }}</label>
      <div class="input">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          autocomplete="current-password"
          [placeholder]="'login.passwordPlaceholder' | t"
          [(ngModel)]="password"
        />
        <button
          type="button"
          class="reveal"
          [attr.aria-pressed]="showPassword()"
          [attr.aria-label]="(showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | t"
          (click)="togglePassword()"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            @if (showPassword()) {
              <path
                d="M9.9 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 4.4-1"
              />
              <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              <path d="m2 2 20 20" />
            } @else {
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" />
              <circle cx="12" cy="12" r="3" />
            }
          </svg>
        </button>
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" name="rememberMe" [(ngModel)]="rememberMe" />
        {{ 'login.remember' | t }}
      </label>
    </div>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" class="submit" [disabled]="submitting()">
      {{ (submitting() ? 'login.submitting' : 'login.title') | t }}
    </button>
  </form>

  <p class="foot">
    {{ 'login.noAccount' | t }} <a class="link" routerLink="/register">{{ 'login.createOne' | t }}</a>
  </p>
</main>
